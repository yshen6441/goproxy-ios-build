name: Build goproxy for iOS (roothide)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout goproxy source
        uses: actions/checkout@v4
        with:
          repository: snail007/goproxy
          ref: master
          path: goproxy

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install ldid and dpkg
        run: brew install ldid dpkg

      - name: Create iOS clang wrapper (Apple toolchain)
        run: |
          cat > clangwrap.sh <<'EOF'
          #!/bin/sh
          exec xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 "$@"
          EOF
          chmod +x clangwrap.sh

      - name: Build goproxy (GOOS=ios arm64)
        working-directory: goproxy
        run: |
          go mod download all
          export SDKROOT="$(xcrun -sdk iphoneos --show-sdk-path)"
          export GOOS=ios GOARCH=arm64 CGO_ENABLED=1
          export CC="$GITHUB_WORKSPACE/clangwrap.sh"
          go build -trimpath -ldflags "-s -w" -o goproxy-ios .

      - name: Sign with roothide entitlements
        run: |
          cat > roothide.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.security.storage.AppBundles</key>
              <true/>
              <key>com.apple.private.security.storage.AppDataContainers</key>
              <true/>
          </dict>
          </plist>
          EOF
          ldid -Sroothide.entitlements goproxy/goproxy-ios

      - name: Verify Mach-O
        run: |
          lipo -info goproxy/goproxy-ios
          otool -l goproxy/goproxy-ios | grep -A6 LC_BUILD_VERSION | head -12

      - name: Package deb (iphoneos-arm64e)
        run: |
          mkdir -p pkg/DEBIAN pkg/usr/local/bin
          cp goproxy/goproxy-ios pkg/usr/local/bin/goproxy
          cat > pkg/DEBIAN/control <<'EOF'
          Package: com.snail007.goproxy
          Name: goproxy
          Version: 3.0
          Architecture: iphoneos-arm64e
          Description: High-performance proxy for iOS (http/https/socks5/tcp/udp/tunnel)
          Maintainer: goproxy <goproxy.win>
          Section: Networking
          Depends: firmware (>= 12.0)
          Author: snail007
          Homepage: https://www.goproxy.win/
          EOF
          chmod 755 pkg/DEBIAN
          dpkg-deb -Zgzip -b pkg goproxy_3.0_iphoneos-arm64e.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goproxy-ios-build
          path: |
            goproxy/goproxy-ios
            goproxy_3.0_iphoneos-arm64e.deb

  build-mihomo:
    runs-on: macos-latest

    steps:
      - name: Checkout mihomo source
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: v1.19.29
          path: mihomo

      - name: Checkout build repo (cns patch)
        uses: actions/checkout@v4
        with:
          path: buildrepo

      - name: Apply CNS protocol patch
        working-directory: mihomo
        run: |
          git apply "$GITHUB_WORKSPACE/buildrepo/cns.patch"
          ls adapter/outbound/cns.go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install ldid and dpkg
        run: brew install ldid dpkg

      - name: Create iOS clang wrapper (Apple toolchain)
        run: |
          cat > clangwrap.sh <<'EOF'
          #!/bin/sh
          exec xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=17.0 "$@"
          EOF
          chmod +x clangwrap.sh

      - name: Build mihomo (GOOS=ios arm64)
        working-directory: mihomo
        run: |
          go mod download all
          export SDKROOT="$(xcrun -sdk iphoneos --show-sdk-path)"
          export GOOS=ios GOARCH=arm64 CGO_ENABLED=1
          export CC="$GITHUB_WORKSPACE/clangwrap.sh"
          go build -trimpath -ldflags "-s -w -X github.com/metacubex/mihomo/constant.Version=v1.19.29" -o mihomo-ios .

      - name: Sign with roothide entitlements
        run: |
          cat > roothide.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.security.storage.AppBundles</key>
              <true/>
              <key>com.apple.private.security.storage.AppDataContainers</key>
              <true/>
          </dict>
          </plist>
          EOF
          ldid -Sroothide.entitlements mihomo/mihomo-ios

      - name: Download metacubexd dashboard
        run: |
          curl -sL -o /tmp/metacubexd.zip https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
          mkdir -p /tmp/metacubexd
          unzip -q /tmp/metacubexd.zip -d /tmp/metacubexd
          ls /tmp/metacubexd

      - name: Package deb (iphoneos-arm64e)
        run: |
          mkdir -p pkg/DEBIAN pkg/usr/local/bin pkg/usr/local/share/mihomo/ui
          cp mihomo/mihomo-ios pkg/usr/local/bin/mihomo
          cp -r /tmp/metacubexd/metacubexd-gh-pages/* pkg/usr/local/share/mihomo/ui/
          cat > pkg/DEBIAN/control <<'EOF'
          Package: com.metacubex.mihomo
          Name: mihomo
          Version: 1.19.29
          Architecture: iphoneos-arm64e
          Description: mihomo (Clash.Meta) rule-based proxy for iOS (http/socks5/vmess/trojan/ss/cns)
          Maintainer: MetaCubeX
          Section: Networking
          Depends: firmware (>= 12.0)
          Author: MetaCubeX
          Homepage: https://github.com/MetaCubeX/mihomo
          EOF
          chmod 755 pkg/DEBIAN
          dpkg-deb -Zgzip -b pkg mihomo_1.19.29_iphoneos-arm64e.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-ios-build
          path: |
            mihomo/mihomo-ios
            mihomo_1.19.29_iphoneos-arm64e.deb

  build-toggle:
    runs-on: macos-latest

    steps:
      - name: Checkout build repo (toggle app)
        uses: actions/checkout@v4
        with:
          path: buildrepo

      - name: Install ldid and dpkg
        run: brew install ldid dpkg

      - name: Compile SwiftUI app
        working-directory: buildrepo/mihomo-toggle
        run: |
          SDKROOT="$(xcrun -sdk iphoneos --show-sdk-path)"
          mkdir -p MihomoToggle.app
          xcrun -sdk iphoneos swiftc -parse-as-library \
            -target arm64-apple-ios15.0 \
            -sdk "$SDKROOT" \
            Sources/MihomoToggle.swift \
            -o MihomoToggle.app/MihomoToggle \
            -framework SwiftUI -framework UIKit -framework Foundation -framework NetworkExtension
          cp Info.plist MihomoToggle.app/Info.plist
          lipo -info MihomoToggle.app/MihomoToggle

      - name: Compile tunnel extension
        working-directory: buildrepo/mihomo-toggle
        run: |
          SDKROOT="$(xcrun -sdk iphoneos --show-sdk-path)"
          mkdir -p MihomoToggle.app/PlugIns/MihomoTunnel.appex
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDKROOT" \
            -module-name MihomoTunnel \
            Sources/main.swift \
            Sources/TunnelProvider.swift \
            -o MihomoToggle.app/PlugIns/MihomoTunnel.appex/MihomoTunnel \
            -framework NetworkExtension -framework Foundation
          cp TunnelInfo.plist MihomoToggle.app/PlugIns/MihomoTunnel.appex/Info.plist
          lipo -info MihomoToggle.app/PlugIns/MihomoTunnel.appex/MihomoTunnel

      - name: Sign with roothide entitlements
        working-directory: buildrepo/mihomo-toggle
        run: |
          cat > roothide.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.private.security.storage.AppBundles</key>
              <true/>
              <key>com.apple.private.security.storage.AppDataContainers</key>
              <true/>
              <key>com.apple.private.skip-library-validation</key>
              <true/>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
              </array>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          cat > tunnel.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.private.skip-library-validation</key>
              <true/>
              <key>com.apple.developer.networking.networkextension</key>
              <array>
                  <string>packet-tunnel-provider</string>
              </array>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          ldid -Sroothide.entitlements MihomoToggle.app/MihomoToggle
          ldid -Stunnel.entitlements MihomoToggle.app/PlugIns/MihomoTunnel.appex/MihomoTunnel

      - name: Package deb (iphoneos-arm64e)
        working-directory: buildrepo/mihomo-toggle
        run: |
          mkdir -p pkg/DEBIAN pkg/Applications
          cp -r MihomoToggle.app pkg/Applications/
          cat > pkg/DEBIAN/control <<'EOF'
          Package: com.metacubex.mihomo-toggle
          Name: mihomo-toggle
          Version: 1.6
          Architecture: iphoneos-arm64e
          Description: One-tap run/stop mihomo with config switching (roothide)
          Maintainer: MetaCubeX
          Section: Utilities
          Depends: firmware (>= 15.0)
          Author: MetaCubeX
          EOF
          cat > pkg/DEBIAN/postinst <<'EOF'
          #!/bin/bash
          mkdir -p /var/mobile/.config/mihomo
          /var/jb/usr/bin/launchctl bootout system/com.metacubex.helper 2>/dev/null || true
          /var/jb/usr/bin/launchctl bootout system/com.metacubex.mihomo 2>/dev/null || true
          rm -f /var/jb/Library/LaunchDaemons/com.metacubex.helper.plist /var/jb/Library/LaunchDaemons/com.metacubex.mihomo.plist 2>/dev/null || true
          if [ -x /var/jb/usr/bin/uicache ]; then
            /var/jb/usr/bin/uicache -a 2>/dev/null || true
          fi
          exit 0
          EOF
          cat > pkg/DEBIAN/prerm <<'EOF'
          #!/bin/bash
          if [ -f /var/mobile/.config/mihomo/.mihomo.pid ]; then
            PID=$(cat /var/mobile/.config/mihomo/.mihomo.pid)
            [ -n "$PID" ] && kill "$PID" 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 755 pkg/DEBIAN/postinst pkg/DEBIAN/prerm
          chmod 755 pkg/DEBIAN
          dpkg-deb -Zgzip -b pkg mihomo-toggle_1.6_iphoneos-arm64e.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-toggle-build
          path: |
            buildrepo/mihomo-toggle/MihomoToggle.app/
            buildrepo/mihomo-toggle/mihomo-toggle_*.deb
